<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:12px;background:#0e1821;color:#e8f5f5;font:16px sans-serif}h1{font-size:23px;color:#63e1c9;margin:4px 0}small{color:#9ab1c2}button{display:block;width:100%;padding:10px;margin:8px 0;border:1px solid #335266;background:#192d3c;color:white;text-align:left;font-size:16px;border-radius:8px}button.sel{border-color:#63e1c9;background:#254d53}b{color:#63e1c9}.count{font-size:40px;margin:12px 0}p{font-size:13px}</style><h1>Pocket Board</h1><small>LEO WEB · OFFLINE</small><div class="count" id="count"></div><button>+ Add one</button><button>− Remove one</button><button>Reset counter</button><p>D-pad: select · OK: action<br>Counter saved locally, per app.</p><script>var value=+(localStorage.getItem('counter')||0),at=0,buttons=document.querySelectorAll('button');function draw(){document.getElementById('count').textContent=value;for(var i=0;i<buttons.length;i++)buttons[i].className=i===at?'sel':'';}function action(){value=at===0?value+1:at===1?value-1:0;localStorage.setItem('counter',String(value));draw();}window.leoKey=function(k){if(k===19||k===21)at=(at+2)%3;else if(k===20||k===22)at=(at+1)%3;else if(k===23)action();draw();};for(var i=0;i<buttons.length;i++)(function(n){buttons[n].onclick=function(){at=n;action();};})(i);draw();</script></html>
